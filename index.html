<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Maquetación CSS</title>
<!-- AQUI SE CONECTA EL CSS -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="inicio">
    <!-- Nubes decorativas de CSS puro -->
    <div class="nube nube-1"></div>
    <div class="nube nube-2"></div>
    <div class="nube nube-3"></div>
    <!-- Destello de luz estilo "lens flare" -->
    <div class="destello"></div>

    <h1>Pagina Web</h1>
    <!-- Boton para activar/desactivar el modo oscuro -->
    <button id="btn-modo-oscuro" class="btn-modo-oscuro" title="Cambiar modo claro/oscuro">🌙</button>
</header>

<!-- Capa de burbujas que flotan por toda la pagina (las crea script.js) -->
<div id="capa-burbujas" class="capa-burbujas"></div>

<nav>
    <ul>
        <li><a href="#inicio" class="nav-link">Inicio</a></li>
        <li><a href="#content" class="nav-link">Contenido</a></li>
        <li><a href="#">Requisitos</a></li>
        <li><a href="#">Lenguajes</a></li>
        <li><a href="#">Frameworks</a></li>
        <li><a href="#">Proyectos</a></li>
    </ul>
</nav>

<div class="clearfix"></div>

<!-- Este contenedor centra el bloque de contenido+aside y le pone un ancho maximo -->
<div class="contenedor">

    <section id="content">

        <article class="article">
            <h2>Imagen 1</h2>
            <img src="bandera.png" style="width:250px; height:100px;" class="img-galeria">
            <p>Si si Colombia, si si caribe...</p>
        </article>

        <article class="article">
            <h2>Imagen 2</h2>
            <img src="odst.png" style="width:250px; height:250px;" class="img-galeria">
            <p>El Covenant se acerca</p>
        </article>

        <article class="article">
            <h2>Imagen 3</h2>
            <img src="pg.png" style="width:250px; height:250px;" class="img-galeria">
            <p>Pingüino</p>
        </article>

    </section>

    <div class="clearfix"></div>

    <!-- Barra de busqueda horizontal, debajo del contenido -->
    <aside>
        <h2>Barra de busqueda</h2>
        <form id="form-busqueda">
            <input type="text" id="input-busqueda" placeholder="Escribe algo...">
            <input type="submit" value="Buscar">
        </form>
        <!-- Aqui aparecera el mensaje de error o resultado -->
        <p id="mensaje-busqueda" class="mensaje-busqueda"></p>
    </aside>

</div>

<footer>
    Maquetación con CSS
</footer>

<!-- Overlay/Lightbox para ampliar imagenes (empieza oculto) -->
<div id="lightbox" class="lightbox">
    <img id="lightbox-img" src="" alt="Imagen ampliada">
</div>

<!-- Boton flotante para volver arriba (empieza oculto via CSS/JS) -->
<button id="btn-arriba" class="btn-arriba" title="Volver arriba">↑</button>

<!-- AQUI SE CONECTA EL JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
