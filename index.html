<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portal de Recompensas</title>
<!-- Fuentes de estilo sci-fi / holograma -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!-- AQUI SE CONECTA EL CSS -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="inicio">
    <!-- Barrido de escaneo tipo holograma -->
    <div class="barrido"></div>

    <h1>Portal de Recompensas</h1>
</header>

<!-- Capa de particulas/estatica flotando por toda la pagina (las crea script.js) -->
<div id="capa-particulas" class="capa-particulas"></div>

<nav>
    <ul>
        <li><a href="#inicio" class="nav-link">Inicio</a></li>
        <li><a href="#content" class="nav-link">Contenido</a></li>
        <li><a href="#">Requisitos</a></li>
        <li><a href="#">Lenguajes</a></li>
        <li><a href="#">Frameworks</a></li>
        <li><a href="#">Proyectos</a></li>
    </ul>
</nav>

<div class="clearfix"></div>

<!-- Este contenedor centra el bloque de contenido+aside y le pone un ancho maximo -->
<div class="contenedor">

    <section id="content">

        <article class="article">
            <span class="sello">SE BUSCA</span>
            <h2>Nombre</h2>
            <div class="marco-holograma">
                <img src="Petrowsky.png" style="width:200px; height:250px;" class="img-galeria">
            </div>
            <p>Descripcion</p>
        </article>

        <article class="article">
            <span class="sello">SE BUSCA</span>
            <h2>Nombre</h2>
            <div class="marco-holograma">
                <img src="odst.png" style="width:200px; height:250px;" class="img-galeria">
            </div>
            <p>Descripcion</p>
        </article>

        <article class="article">
            <span class="sello">SE BUSCA</span>
            <h2>Nombre</h2>
            <div class="marco-holograma">
                <img src="pg.png" style="width:200px; height:250px;" class="img-galeria">
            </div>
            <p>Pingüino</p>
        </article>

    </section>

    <div class="clearfix"></div>

    <!-- Barra de busqueda horizontal, debajo del contenido -->
    <aside>
        <h2>Barra de busqueda</h2>
        <form id="form-busqueda">
            <input type="text" id="input-busqueda" placeholder="Escribe algo...">
            <input type="submit" value="Buscar">
        </form>
        <!-- Aqui aparecera el mensaje de error o resultado -->
        <p id="mensaje-busqueda" class="mensaje-busqueda"></p>
    </aside>

</div>

<footer>
    Maquetación con CSS
</footer>

<!-- Overlay/Lightbox para ampliar imagenes (empieza oculto) -->
<div id="lightbox" class="lightbox">
    <img id="lightbox-img" src="" alt="Imagen ampliada">
</div>

<!-- Boton flotante para volver arriba (empieza oculto via CSS/JS) -->
<button id="btn-arriba" class="btn-arriba" title="Volver arriba">↑</button>

<!-- AQUI SE CONECTA EL JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
